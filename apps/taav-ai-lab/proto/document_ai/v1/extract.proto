syntax = "proto3";

package taav.documentai.v1;

// Document AI — structured extraction contracts (phase 1 sync paths).
// Domain Backend (.NET) calls Python Document AI via gRPC.

service DocumentExtractService {
  // Unary: full structured response in one message (maps to gRPC Request/Response in Ai Lab).
  rpc ExtractSync(ExtractRequest) returns (ExtractResponse);

  // Server-streaming: field-level events as extraction progresses (maps to gRPC Streaming in Ai Lab).
  rpc ExtractStream(ExtractRequest) returns (stream ExtractFieldEvent);
}

message ExtractRequest {
  string tenant_id = 1;
  string caller_service = 2;
  string correlation_id = 3;
  FileRef file = 4;
  ExtractionSpec extraction = 5;
  ProcessingPolicy processing_policy = 6;
  ExtractOptions options = 7;
}

message FileRef {
  string download_url = 1;
  string file_name = 2;
  string mime_type = 3;
}

message ExtractionSpec {
  ExtractionSchema schema = 1;
  string prompt = 2;
}

message ExtractionSchema {
  repeated FieldSchema fields = 1;
}

message FieldSchema {
  string key = 1;
  string label = 2;
  string description = 3;
  string type = 4;
  bool required = 5;
  FieldValidation validation = 6;
  FieldNormalization normalization = 7;
}

message FieldValidation {
  string regex = 1;
  int32 min_length = 2;
  int32 max_length = 3;
  double min = 4;
  double max = 5;
}

message FieldNormalization {
  bool remove_spaces = 1;
  bool convert_persian_digits = 2;
  bool trim = 3;
  bool uppercase = 4;
  bool collapse_spaces = 5;
}

message ProcessingPolicy {
  bool store_result = 1;
  bool store_raw_text = 2;
  bool allow_vector_indexing = 3;
  int32 retention_days = 4;
  string data_classification = 5;
}

message ExtractOptions {
  bool include_raw_text = 1;
  bool include_document_quality = 2;
}

message ExtractResponse {
  string request_id = 1;
  string job_id = 2;
  string status = 3;
  string overall_status = 4;
  repeated ExtractedField fields = 5;
  repeated string warnings = 6;
  Usage usage = 7;
  DocumentQuality document_quality = 8;
  int64 duration_ms = 9;
}

message ExtractFieldEvent {
  int32 sequence = 1;
  string field_key = 2;
  string partial_value = 3;
  bool is_final = 4;
  double confidence = 5;
}

message ExtractedField {
  string key = 1;
  string value = 2;
  string normalized_value = 3;
  double confidence = 4;
  string validation_status = 5;
  string review_status = 6;
  repeated string warnings = 7;
}

message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 total_tokens = 3;
  string model = 4;
}

message DocumentQuality {
  double score = 1;
  repeated string warnings = 2;
}
